# from https://github.com/mlfoundations/dcft_private/blob/main/dcft/train/hp_settings/reasoning.yaml
# plus https://github.com/mlfoundations/dcft_private/blob/main/dcft/train/configs/multiple_samples/multiple_samples_none_numina_aime.yaml

# https://github.com/mlfoundations/dcft_private/pull/291/files#diff-3df799a0c8c680084a6046c2c28675dc353126309b25b695ff5c586dd9d6db77

# SHARED 
### model
model_name_or_path: Qwen/Qwen2.5-7B-Instruct

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z3_offload_config.json  # choices: [ds_z0_config.json, ds_z2_config.json, ds_z3_config.json]

### dataset
template: qwen25
cutoff_len: 16384
max_samples: 1000000
overwrite_cache: true
preprocessing_num_workers: 16

### output
logging_steps: 1
save_strategy: epoch
plot_loss: true

### train
# global_batch_size: 1
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

# OTHER
dataset: mlfoundations-dev/wikipedia_seed_science
# INTEAD PUT THESE IN data/dataset_info.json
# messages: conversations
# formatting: sharegpt
# role_tag: from
# content_tag: value
# user_tag: human
# assistant_tag: gpt

output_dir: saves/test

per_device_train_batch_size: 1      # Can change depending on hardware
gradient_accumulation_steps: 1      # Can change depending on number of GPUs